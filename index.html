 model — high value for long-context, multimodal and agentic workloads; prime threats come from larger reasoning-focused models (DeepSeek-V3.2) and newer Qwen 3.6 family variants.","overall_position":"strong","strongest_competitor":{"name":"DeepSeek-V3.2","why":"DeepSeek-V3.2 is a much larger sparse model positioned and benchmarked for high-end reasoning and agentic tasks (model card reports 671B total / 37B activated and a 128K native context), with vendor and independent leaderboards showing it near the top on reasoning/coding leaderboards. This makes it the strongest immediate competitive threat on pure reasoning/agent benchmarks.","evidence_ids":["E002","E003"]},"top_strengths":[{"text":"Air-friendly MoE design: 35B total / ~3B active improves local inference efficiency vs dense models of similar capability; official model card documents 35B total and 3B activated and 256 experts with 8 routed + 1 shared active experts.","evidence_ids":["E001"]},{"text":"Native long-context and multimodal support: native 262,144 token context (extensible to ~1,010,000) and a vision encoder for image/video inputs — valuable for agentic, multimodal tasks.","evidence_ids":["E001"]},{"text":"Open license and broad runtime support: Apache-2.0 license, official Hugging Face release and documented support for vLLM, SGLang, Transformers, and community GGUF quantizations — accelerates adoption and self-hosting.","evidence_ids":["E001","E005"]},{"text":"Strong community adoption/download momentum (high monthly downloads on Hugging Face) and many community quant/finetune artifacts.","evidence_ids":["E001","E006"]}],"top_weaknesses":[{"text":"Outgunned on top-tier reasoning/coding leaderboards by larger, high-activated-param sparse models (DeepSeek-V3.2 claims) and by newer Qwen3.6 variants on coding-specific benchmarks.","evidence_ids":["E002","E008","E004"]},{"text":"Local deployment experience depends on community quant recipes and third-party runtimes for very low-memory endpoints — leads to variability in performance and user experience across setups.","evidence_ids":["E005","E007"]},{"text":"Benchmarks are heterogeneous — many apparent wins in vendor tables are not directly comparable with independent leaderboards; requires continued independent validation.","evidence_ids":["E001","E004"]}],"biggest_threat":{"text":"DeepSeek-V3.2 (and any successor DeepSeek variants) — because their architecture and published results emphasize high-end reasoning/agent performance at scale; if DeepSeek captures enterprise mindshare on agent tooling and reasoning leaderboards, it may displace Qwen in high-value use cases.","evidence_ids":["E002","E003","E004"]}},"changes":{"status":"changes_detected","new":[{"entity":"Qwen3.6 family (open-weight releases)","change":"Alibaba published Qwen3.6 series and open-weight variants (including Qwen3.6-35B-A3B and Qwen3.6-27B); Qwen3.6 materials emphasize improved agentic coding and newer benchmarks.","date":"2026-04-02","evidence_ids":["E008"]},{"entity":"DeepSeek-V3.2 (public model card)","change":"DeepSeek published a detailed model card and technical documentation for DeepSeek-V3.2 (official PDF model card with parameters, context, license).","date":"2026-04-17","evidence_ids":["E002"]}],"changed":[{"entity":"Benchmark leaderboards (MMLU-Redux and others)","change":"Independent/aggregated leaderboards updated in 2026 show frontier models (including Qwen variants and DeepSeek) in new positions; many public leaderboards now include MMLU-Redux and other 'hardened' benchmarks with differing harnesses (comparability concerns).","date":"2026-09-15","evidence_ids":["E004"]},{"entity":"Community quantization & GGUF ecosystem","change":"Rapid growth in community GGUF / quant builds for Qwen3.5 family (many 4-bit/8-bit GGUFs) and improved small-memory recipes enabling Qwen3.5-35B-A3B operation on consumer GPUs.","date":"2026-06-01","evidence_ids":["E005","E007"]}],"removed":[{"entity":"previous-run baseline","change":"Baseline run cpp / GGUF (community quant builds)","KTransformers"],"air_gap_ready":"yes","air_gap_notes":"Model weights are available as open artifacts on Hugging Face (Apache-2.0). After downloading required artifacts (model files, quant files, runtime binaries) Qwen can be served fully offline using vLLM / SGLang / local llama.cpp builds; community recipes enable low-VRAM usage via GGUF quantizations.","evidence_ids":["E001","E005","E006","E007"]},{"model":"DeepSeek-V3.2","total_parameters_b":671,"active_parameters_b":37,"minimum_memory_gb":null,"recommended_memory_gb":null,"memory_notes":"DeepSeek is a very large sparse model (671B total, 37B activated reported in official model card). Practical local deployment will require large multi-GPU / high-memory inference clusters or heavy quantization and model-parallel strategies. Community quantizations exist but operational minimums vary significantly by quant and hardware. No single reliable official 'min VRAM' number available for full BF16 run.","quantization_options":["Safetensors BF16/F32 (official)","Community FP8 / F8_E4M3 quant formats (HF page lists tensor types)","Community GGUF quant builds (multiple quantizations listed)"],"supported_runtimes":["vLLM","SGLang","Transformers","llama.cpp (community quant builds)"],"air_gap_ready":"yes","air_gap_notes":"DeepSeek assets are distributed via open repositories (MIT license) and Hugging Face; after downloading weights and inference runtimes, local/offline operation is possible. However, practical air-gapped deployment requires sufficient on-prem compute (model-parallel / multi-GPU) or community quantization to reduce resource needs.","evidence_ids":["E002","E003","E005"]}]},"capability_matrix":[{"capability":"conversation","models":[{"model":"Qwen3.5-35B-A3B","status":"yes","notes":"Native chat template and multimodal chat support documented; proven in community deployments and official serving examples (Hugging Face instructions).","evidence_ids":["E001"]},{"model":"DeepSeek-V3.2","status":"yes","notes":"Text-only input/output in some variants but designed for long-context conversation and agentic flows; model card and HF page include chat templates and tool-call support.","evidence_ids":["E002","E003"]}]},{"capability":"reasoning","models":[{"model":"Qwen3.5-35B-A3B","status":"partial","notes":"Strong on many reasoning benchmarks per vendor tables (MMLU-Redux, GPQA); independent leaderboards show good but not top-of-field results. Qwen3.5 architecture includes MoE and DeltaNet to boost reasoning throughput, but larger models (DeepSeek-V3.2) claim advantage on hardest reasoning tasks.","evidence_ids":["E001","E004"]},{"model":"DeepSeek-V3.2","status":"yes","notes":"Positioned and benchmarked by vendor as a reasoning-specialized model (technical report and model card highlight DSA and Speciale variant for deep reasoning). Independent leaderboards also show strong reasoning results.","evidence_ids":["E002","E003","E004"]}]},{"capability":"instruction following","models":[{"model":"Qwen3.5-35B-A3B","status":"yes","notes":"Vendor-published instruction-following scores (IFEval etc.) and chat templates; includes 'thinking' vs 'non-thinking' modes documented.","evidence_ids":["E001"]},{"model":"DeepSeek-V3.2","status":"partial","notes":"Supports instruction-following; vendor materials emphasize agentic behavior and tool integration, but some 'Speciale' variants are optimized for reasoning without tool-calling.","evidence_ids":["E002"]}]},{"capability":"long context","models":[{"model":"Qwen3.5-35B-A3B","status":"yes","notes":"Native 262,144 token context and extensible to ~1,010,000 tokens (official documentation explains rope parameters and framework flags to extend context).","evidence_ids":["E001"]},{"model":"DeepSeek-V3.2","status":"partial","notes":"Official model card lists 128K context natively, and introduction of DeepSeek Sparse Attention (DSA) optimizes long-context efficiency; good but shorter default context than Qwen3.5 native se <script>
(() => {
  'use strict';

  const app = document.getElementById('app');
  const raw = document.getElementById('dashboard-data').textContent.trim();

  if (raw === ('__DASHBOARD_' + 'DATA__')) {
    app.textContent = 'Dashboard template loaded. Waiting for n8n to inject research JSON.';
    app.className = 'empty';
    return;
  }

  let data;
  try {
    data = JSON.parse(raw);
  } catch (error) {
    const box = document.createElement('div');
    box.className = 'error';
    box.textContent = 'Dashboard data is not valid JSON: ' + error.message;
    app.appendChild(box);
    return;
  }

  const arr = value => Array.isArray(value) ? value : [];
  const value = (v, fallback = 'Unknown') => (v === null || v === undefined || v === '') ? fallback : String(v);
  const join = (v, sep = ', ') => arr(v).filter(x => x !== null && x !== undefined && x !== '').join(sep);
  const evidence = ids => join(ids) || 'No evidence ID';

  function el(tag, text, className) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function append(parent, ...children) {
    children.filter(Boolean).forEach(child => parent.appendChild(child));
    return parent;
  }

  function section(title) {
    const s = el('section');
    s.appendChild(el('h2', title));
    app.appendChild(s);
    return s;
  }

  function card(title) {
    const c = el('div', null, 'card');
    if (title) c.appendChild(el('h3', title));
    return c;
  }

  function badge(text, extraClass = '') {
    return el('span', text, ('badge ' + extraClass).trim());
  }

  function list(items, renderer, emptyText = 'None identified.') {
    const ul = el('ul');
    const rows = arr(items);
    if (!rows.length) {
      ul.appendChild(el('li', emptyText, 'empty'));
      return ul;
    }
    rows.forEach(item => ul.appendChild(renderer(item)));
    return ul;
  }

  function textEvidenceItem(item, prefix = '') {
    const li = el('li');
    if (prefix) li.appendChild(el('strong', prefix));
    li.appendChild(document.createTextNode(value(item?.text, 'Insufficient evidence')));
    li.appendChild(document.createTextNode(' '));
    li.appendChild(el('span', '[' + evidence(item?.evidence_ids) + ']', 'small'));
    return li;
  }

  function changeItem(item) {
    const li = el('li');
    li.appendChild(el('strong', value(item?.entity)));
    li.appendChild(document.createTextNode(': ' + value(item?.change, 'Insufficient evidence')));
    if (item?.date) li.appendChild(document.createTextNode(' (' + item.date + ')'));
    li.appendChild(document.createTextNode(' '));
    li.appendChild(el('span', '[' + evidence(item?.evidence_ids) + ']', 'small'));
    return li;
  }

  function table(headers, rows) {
    const wrap = el('div', null, 'scroll');
    const t = el('table');
    const thead = el('thead');
    const hr = el('tr');
    headers.forEach(h => hr.appendChild(el('th', h)));
    thead.appendChild(hr);
    t.appendChild(thead);

    const tbody = el('tbody');
    rows.forEach(row => {
      const tr = el('tr');
      row.forEach(cell => {
        const td = el('td');
        if (cell instanceof Node) td.appendChild(cell);
        else td.textContent = value(cell, '');
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    wrap.appendChild(t);
    return wrap;
  }

  function safeLink(url, label) {
    const rawUrl = value(url, '');
    try {
      const parsed = new URL(rawUrl);
      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return el('span', value(label, rawUrl));
      const a = el('a', value(label, rawUrl));
      a.href = parsed.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      return a;
    } catch {
      return el('span', value(label, rawUrl || 'Unknown'));
    }
  }

  const meta = data.meta || {};
  const coverage = data.coverage || {};
  const executive = data.executive_position || {};
  const changes = data.changes || {};
  const snapshot = data.product_snapshot || {};

  document.title = value(meta.product, 'Product') + ' — Competitive Intelligence Dashboard';

  // Header
  const header = el('header');
  header.appendChild(el('h1', value(meta.product, 'Product') + ' — Competitive Intelligence'));
  header.appendChild(el('div',
    'Provider: ' + value(meta.provider) + ' · Run: ' + value(meta.run_date) + ' · Window: ' + value(meta.research_window),
    'meta'
  ));
  const badges = el('div');
  badges.style.marginTop = '8px';
  badges.appendChild(badge('Coverage: ' + value(coverage.overall), coverage.overall ? 'status-' + coverage.overall : ''));
  badges.appendChild(badge('Perspective: ' + value(meta.perspective)));
  badges.appendChild(badge('Change state: ' + value(changes.status)));
  header.appendChild(badges);
  app.appendChild(header);

  // 1. Competitive Position
  {
    const s = section('1. Competitive Position');
    s.appendChild(el('div', value(executive.headline, 'Insufficient evidence'), 'headline'));

    const g1 = el('div', null, 'grid');
    const overall = card('Overall Position');
    overall.appendChild(el('p', value(executive.overall_position)));

    const sc = executive.strongest_competitor || {};
    const strongest = card('Strongest Competitor');
    const pName = el('p');
    pName.appendChild(el('strong', value(sc.name)));
    strongest.appendChild(pName);
    strongest.appendChild(el('p', value(sc.why, 'Insufficient evidence')));
    strongest.appendChild(el('div', evidence(sc.evidence_ids), 'small'));

    const bt = executive.biggest_threat || {};
    const threat = card('Biggest Threat');
    threat.appendChild(el('p', value(bt.text, 'Insufficient evidence')));
    threat.appendChild(el('div', evidence(bt.evidence_ids), 'small'));

    append(g1, overall, strongest, threat);
    s.appendChild(g1);

    const g2 = el('div', null, 'grid');
    g2.style.marginTop = '12px';
    const strengths = card('Top Strengths');
    strengths.appendChild(list(executive.top_strengths, x => textEvidenceItem(x), 'No supported strengths found.'));
    const weaknesses = card('Top Weaknesses');
    weaknesses.appendChild(list(executive.top_weaknesses, x => textEvidenceItem(x), 'No supported weaknesses found.'));
    append(g2, strengths, weaknesses);
    s.appendChild(g2);
  }

  // 2. What Changed
  {
    const s = section('2. What Changed');
    const g = el('div', null, 'grid');
    [['New', changes.new], ['Changed', changes.changed], ['Removed', changes.removed]].forEach(([title, items]) => {
      const c = card(title);
      c.appendChild(list(items, changeItem));
      g.appendChild(c);
    });
    s.appendChild(g);
  }

  // 3. Product Snapshot
  {
    const s = section('3. Product Snapshot');
    const modelUrl = safeLink(snapshot.official_model_url, snapshot.official_model_url || 'Unknown');
    s.appendChild(table(['Field', 'Value'], [
      ['Architecture', value(snapshot.architecture)],
      ['Total Parameters', snapshot.total_parameters_b == null ? 'Unknown' : snapshot.total_parameters_b + ' B'],
      ['Active Parameters', snapshot.active_parameters_b == null ? 'Unknown' : snapshot.active_parameters_b + ' B'],
      ['Context Window', value(snapshot.context_window_tokens)],
      ['License', value(snapshot.license)],
      ['Modalities', join(snapshot.modalities) || 'Unknown'],
      ['Release Date', value(snapshot.release_date)],
      ['Official Model', modelUrl],
      ['Evidence', evidence(snapshot.evidence_ids)]
    ]));
  }

  // 4. Benchmark Scorecard
  {
    const s = section('4. Benchmark Scorecard');
    const benchmarks = arr(data.benchmark_scorecard);
    if (!benchmarks.length) {
      s.appendChild(el('p', 'No sufficiently reliable benchmark comparisons found.', 'empty'));
    } else {
      benchmarks.forEach(b => {
        const c = card(value(b.benchmark) + ' — ' + value(b.category));
        c.style.marginBottom = '12px';
        c.appendChild(el('div', 'Comparability: ' + value(b.comparability) + (b.notes ? ' · ' + b.notes : ''), 'small'));
        c.appendChild(table(['Model', 'Score', 'Variant', 'Source Type', 'Evidence'], arr(b.scores).map(sx => [
          value(sx.model),
          (sx.score == null ? 'N/A' : sx.score) + (sx.unit ? ' ' + sx.unit : ''),
          value(sx.variant, ''),
          value(sx.source_type, ''),
          value(sx.evidence_id, '')
        ])));
        s.appendChild(c);
      });
    }
  }

  // 5. Local Deployment & Efficiency
  {
    const s = section('5. Local Deployment & Efficiency');
    const models = arr(data.deployment_efficiency?.models);
    s.appendChild(table(
      ['Model', 'Total B', 'Active B', 'Min Memory GB', 'Recommended GB', 'Quantization', 'Runtimes', 'Air-Gap', 'Notes', 'Evidence'],
      models.map(m => [
        value(m.model),
        m.total_parameters_b ?? '?',
        m.active_parameters_b ?? '?',
        m.minimum_memory_gb ?? '?',
        m.recommended_memory_gb ?? '?',
        join(m.quantization_options),
        join(m.supported_runtimes),
        value(m.air_gap_ready),
        [m.memory_notes, m.air_gap_notes].filter(Boolean).join(' '),
        evidence(m.evidence_ids)
      ])
    ));
  }

  // 6. Capability Matrix
  {
    const s = section('6. Capability Matrix');
    const rows = [];
    arr(data.capability_matrix).forEach(cap => {
      arr(cap.models).forEach(m => rows.push([
        value(cap.capability), value(m.model), value(m.status), value(m.notes, ''), evidence(m.evidence_ids)
      ]));
    });
    s.appendChild(table(['Capability', 'Model', 'Status', 'Notes', 'Evidence'], rows));
  }

  // 7. Competitor Deep Dives
  {
    const s = section('7. Competitor Deep Dives');
    const g = el('div', null, 'grid');
    arr(data.competitor_deep_dives).forEach(cmp => {
      const c = card(value(cmp.competitor) + ' — Threat: ' + value(cmp.threat_level));

      c.appendChild(el('strong', 'Where they beat the product'));
      c.appendChild(list(cmp.where_they_beat_product, x => textEvidenceItem(x), 'No supported advantage identified.'));

      c.appendChild(el('strong', 'Where the product beats them'));
      c.appendChild(list(cmp.where_product_beats_them, x => textEvidenceItem(x), 'No supported advantage identified.'));

      c.appendChild(el('strong', 'Recent Moves'));
      c.appendChild(list(cmp.recent_moves, x => {
        const li = el('li');
        li.appendChild(document.createTextNode(value(x.text, 'Insufficient evidence')));
        if (x.date) li.appendChild(document.createTextNode(' (' + x.date + ')'));
        li.appendChild(document.createTextNode(' '));
        li.appendChild(el('span', '[' + evidence(x.evidence_ids) + ']', 'small'));
        return li;
      }, 'No recent move identified.'));

      c.appendChild(el('strong', 'Implication'));
      c.appendChild(el('p', value(cmp.implication, 'Insufficient evidence')));
      g.appendChild(c);
    });
    s.appendChild(g);
  }

  // 8. Ecosystem & Adoption
  {
    const s = section('8. Ecosystem & Adoption');
    s.appendChild(table(
      ['Model', 'HF Downloads', 'Runtime Support', 'Quantization Ecosystem', 'Community Signals', 'Evidence'],
      arr(data.ecosystem_adoption).map(e => [
        value(e.model),
        (e.huggingface_downloads == null ? 'N/A' : e.huggingface_downloads) + (e.huggingface_downloads_period ? ' / ' + e.huggingface_downloads_period : ''),
        join(e.runtime_support),
        value(e.quantization_ecosystem),
        join(e.community_signals, '; ') + (e.notes ? ' — ' + e.notes : ''),
        evidence(e.evidence_ids)
      ])
    ));
  }

  // 9. Strategic Actions
  {
    const s = section('9. Strategic Actions');
    const actions = [...arr(data.strategic_actions)].sort((a, b) => (a.priority ?? 999) - (b.priority ?? 999));
    s.appendChild(table(
      ['Priority', 'Category', 'Action', 'Rationale', 'Evidence'],
      actions.map(a => [a.priority ?? '', value(a.category), value(a.action), value(a.rationale), evidence(a.evidence_ids)])
    ));
  }

  // 10. Evidence
  {
    const s = section('10. Evidence');
    const rows = arr(data.evidence).map(e => {
      const source = el('div');
      source.appendChild(safeLink(e.url, e.source_title || e.url || 'Source'));
      source.appendChild(el('br'));
      source.appendChild(el('span', value(e.publisher, ''), 'small'));

      const date = el('div');
      date.appendChild(document.createTextNode(value(e.published_date, 'N/A')));
      date.appendChild(el('br'));
      date.appendChild(el('span', 'Accessed ' + value(e.accessed_date, 'N/A'), 'small'));

      return [value(e.id), value(e.claim), source, date, value(e.source_type), value(e.confidence), value(e.quote_or_data, '')];
    });
    s.appendChild(table(['ID', 'Claim / Data', 'Source', 'Date', 'Type', 'Confidence', 'Supporting Data'], rows));
  }

  // Coverage Details
  {
    const s = section('Coverage Details');
    s.appendChild(table(
      ['Topic', 'Status', 'Notes'],
      arr(coverage.topics).map(t => [value(t.topic), value(t.status), value(t.notes, '')])
    ));
  }
})();
</script>

</body>
