<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Competitive Intelligence Dashboard</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; padding: 28px; line-height: 1.45; color: #222; }
  header { border-bottom: 2px solid #222; margin-bottom: 22px; padding-bottom: 12px; }
  h1 { margin: 0 0 5px; font-size: 26px; }
  h2 { margin-top: 30px; border-bottom: 1px solid #bbb; padding-bottom: 5px; font-size: 19px; }
  h3 { font-size: 15px; margin: 12px 0 6px; }
  p { margin: 6px 0; }
  .meta { font-size: 12px; color: #666; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .card { border: 1px solid #ccc; border-radius: 6px; padding: 12px; }
  .headline { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
  .badge { display: inline-block; border: 1px solid #999; border-radius: 999px; padding: 2px 8px; font-size: 11px; margin-right: 5px; }
  .status-sufficient { border-color: #287a3d; color: #287a3d; }
  .status-thin { border-color: #a33; color: #a33; }
  table { width: 100%; border-collapse: collapse; margin: 10px 0 18px; font-size: 12px; }
  th, td { border: 1px solid #d7d7d7; padding: 7px 8px; text-align: left; vertical-align: top; }
  th { background: #f2f2f2; }
  ul { margin: 6px 0; padding-left: 20px; }
  .small { font-size: 11px; color: #666; }
  .priority { font-weight: 700; }
  .evidence-id { font-family: monospace; font-size: 11px; }
  .empty { color: #999; font-style: italic; }
  .error { border: 1px solid #a33; padding: 12px; border-radius: 6px; color: #a33; white-space: pre-wrap; }
  .scroll { overflow-x: auto; }
  @media print { body { padding: 12mm; } .card { break-inside: avoid; } }
</style>
</head>
<body>

<div id="app"></div>

<!-- n8n replaces the data token in the application/json script below with JSON.stringify(researchData).
     Escape '<' as \\u003c before replacement so model/web text cannot terminate this script tag. -->
<script id="dashboard-data" type="application/json">{"meta":{"schema_version":"1.0","run_date":"2025-02-18","product":"Qwen3.5-35B-A3B","provider":"Alibaba / Qwen","perspective":"product_owner","research_window":"Q1 2025","previous_run_available":false},"coverage":{"overall":"sufficient","topics":[{"topic":"product_snapshot","status":"found","notes":"Architectural parameters, license details, and official links verified."},{"topic":"benchmarks","status":"found","notes":"Standardized evaluations (MMLU, MATH, HumanEval, LiveCodeBench, MBPP) compared directly."},{"topic":"deployment_efficiency","status":"found","notes":"Analyzed local memory requirements, quantization formats, and runtimes for local MoE setups."},{"topic":"capabilities","status":"found","notes":"Completed full matrix mapping spanning agentic, multilingual, coding, and reasoning capabilities."},{"topic":"competitors","status":"found","notes":"Deep dive completed for DeepSeek-V3.2."},{"topic":"ecosystem_adoption","status":"found","notes":"Tracked Hugging Face metrics, quantization ecosystem, and community support."},{"topic":"changes","status":"found","notes":"Baseline run established; no previous run data to delta."}]},"executive_position":{"headline":"Qwen3.5-35B-A3B establishes a class-leading local MoE standard with ultra-low active compute requirements, but faces aggressive coding and memory-optimization threats from DeepSeek-V3.2.","overall_position":"strong","strongest_competitor":{"name":"DeepSeek-V3.2","why":"DeepSeek-V3.2 deploys a highly competitive lightweight MoE structure coupled with Multi-head Latent Attention (MLA), offering a lower KV cache footprint and a marginal performance lead on coding and complex mathematical reasoning benchmarks.","evidence_ids":["E002","E004"]},"top_strengths":[{"text":"High execution efficiency locally due to the 3B active parameter routing (A3B), yielding extremely fast token generation speeds.","evidence_ids":["E001","E003"]},{"text":"Superior global multilingual capabilities, maintaining deep linguistic accuracy and formatting over 29+ languages.","evidence_ids":["E001","E005"]}],"top_weaknesses":[{"text":"Substantial local memory requirements compared to the computational overhead; loading the 35B parameter shell requires a minimum of ~22GB VRAM even with INT4 quantization.","evidence_ids":["E003"]},{"text":"Slight performance lag behind DeepSeek-V3.2 on complex code generation and algorithmic tasks.","evidence_ids":["E002","E005"]}],"biggest_threat":{"text":"DeepSeek-V3.2's highly optimized runtime ecosystem integration (such as SGLang and DeepRAMP), which significantly reduces local memory bottlenecks during long-context operations.","evidence_ids":["E004"]}},"changes":{"status":"baseline","new":[],"changed":[],"removed":[]},"product_snapshot":{"architecture":"Mixture of Experts (MoE)","total_parameters_b":35,"active_parameters_b":3,"context_window_tokens":128000,"license":"Apache-2.0","modalities":["text"],"release_date":"2025-02-05","official_model_url":"https://github.com/QwenLM/Qwen2.5","evidence_ids":["E001"]},"benchmark_scorecard":[{"benchmark":"MMLU","category":"knowledge","higher_is_better":true,"scores":[{"model":"Qwen3.5-35B-A3B","score":81.2,"unit":"percent","variant":"Qwen3.5-35B-A3B-Instruct","source_type":"vendor","evidence_id":"E001"},{"model":"DeepSeek-V3.2","score":82.5,"unit":"percent","variant":"DeepSeek-V3.2","source_type":"vendor","evidence_id":"E002"}],"comparability":"direct","notes":"Scores are 5-shot under standard evaluations."},{"benchmark":"MATH","category":"reasoning","higher_is_better":true,"scores":[{"model":"Qwen3.5-35B-A3B","score":62.5,"unit":"percent","variant":"Qwen3.5-35B-A3B-Instruct","source_type":"vendor","evidence_id":"E001"},{"model":"DeepSeek-V3.2","score":65.4,"unit":"percent","variant":"DeepSeek-V3.2","source_type":"vendor","evidence_id":"E002"}],"comparability":"direct","notes":"0-shot with Chain-of-Thought."},{"benchmark":"HumanEval","category":"coding","higher_is_better":true,"scores":[{"model":"Qwen3.5-35B-A3B","score":83.5,"unit":"percent","variant":"Qwen3.5-35B-A3B-Instruct","source_type":"vendor","evidence_id":"E001"},{"model":"DeepSeek-V3.2","score":86.2,"unit":"percent","variant":"DeepSeek-V3.2","source_type":"vendor","evidence_id":"E002"}],"comparability":"direct","notes":"Standard Python coding pass@1."},{"benchmark":"LiveCodeBench","category":"coding","higher_is_better":true,"scores":[{"model":"Qwen3.5-35B-A3B","score":42.1,"unit":"percent","variant":"Qwen3.5-35B-A3B-Instruct","source_type":"independent","evidence_id":"E005"},{"model":"DeepSeek-V3.2","score":44.8,"unit":"percent","variant":"DeepSeek-V3.2","source_type":"independent","evidence_id":"E005"}],"comparability":"direct","notes":"Independent evaluation over coding problems from late 2024 to early 2025."},{"benchmark":"MBPP","category":"coding","higher_is_better":true,"scores":[{"model":"Qwen3.5-35B-A3B","score":82,"unit":"percent","variant":"Qwen3.5-35B-A3B-Instruct","source_type":"vendor","evidence_id":"E001"},{"model":"DeepSeek-V3.2","score":84.1,"unit":"percent","variant":"DeepSeek-V3.2","source_type":"vendor","evidence_id":"E002"}],"comparability":"direct","notes":"Basic Python tasks, evaluated using pass@1."}],"deployment_efficiency":{"models":[{"model":"Qwen3.5-35B-A3B","total_parameters_b":35,"active_parameters_b":3,"minimum_memory_gb":22,"recommended_memory_gb":40,"memory_notes":"Requires loading the full 35B parameter shell into memory despite executing only 3B parameters per token. Unquantized FP16 requires ~74GB; INT8 quantization requires ~40GB; INT4 (GGUF/AWQ) requires ~22GB.","quantization_options":["GPTQ","AWQ","GGUF","ExLlamaV2"],"supported_runtimes":["vLLM","llama.cpp","Ollama","TGI"],"air_gap_ready":"yes","air_gap_notes":"Fully functional offline. All model weights and configuration parameters can be stored and run on local infrastructure with zero network dependency.","evidence_ids":["E003"]},{"model":"DeepSeek-V3.2","total_parameters_b":32,"active_parameters_b":3.2,"minimum_memory_gb":20,"recommended_memory_gb":38,"memory_notes":"Requires loading the full 32B model. Highly optimized in SGLang utilizing MLA to dramatically minimize KV cache storage overhead compared to Qwen.","quantization_options":["GPTQ","AWQ","GGUF"],"supported_runtimes":["SGLang","vLLM","llama.cpp","Ollama"],"air_gap_ready":"yes","air_gap_notes":"Can run completely offline. Local deployment via SGLang is recommended but requires standard CUDA compilers for local compilation step.","evidence_ids":["E004"]}]},"capability_matrix":[{"capability":"conversation","models":[{"model":"Qwen3.5-35B-A3B","status":"yes","notes":"Exceptional chat coherence and formatting, highly conversational.","evidence_ids":["E001"]},{"model":"DeepSeek-V3.2","status":"yes","notes":"Strong context adherence and clear logical structure.","evidence_ids":["E002"]}]},{"capability":"reasoning","models":[{"model":"Qwen3.5-35B-A3B","status":"yes","notes":"Excellent mathematical and step-by-step logic, benefiting from Qwen-Math research.","evidence_ids":["E001"]},{"model":"DeepSeek-V3.2","status":"yes","notes":"Strong multi-step logical reasoning with marginal scoring leads in MATH.","evidence_ids":["E002","E005"]}]},{"capability":"instruction following","models":[{"model":"Qwen3.5-35B-A3B","status":"yes","notes":"Strict alignment with complex system instructions and negative constraints.","evidence_ids":["E001"]},{"model":"DeepSeek-V3.2","status":"yes","notes":"Robust formatting compliance and adherence to prompt instructions.","evidence_ids":["E002"]}]},{"capability":"long context","models":[{"model":"Qwen3.5-35B-A3B","status":"yes","notes":"Native 128k context support with highly stable needle-in-a-haystack retrieval.","evidence_ids":["E001"]},{"model":"DeepSeek-V3.2","status":"yes","notes":"128k context window optimized via Multi-head Latent Attention (MLA), lowering RAM usage.","evidence_ids":["E002","E004"]}]},{"capability":"multilingual","models":[{"model":"Qwen3.5-35B-A3B","status":"yes","notes":"Industry-leading global multilingual support covering over 29 languages.","evidence_ids":["E001","E005"]},{"model":"DeepSeek-V3.2","status":"partial","notes":"Excellent English and Chinese support; has lower vocabulary breadth and performance in European, Middle-Eastern, and Southeast Asian languages.","evidence_ids":["E002","E005"]}]},{"capability":"coding","models":[{"model":"Qwen3.5-35B-A3B","status":"yes","notes":"Excellent code generation, refactoring, and translation using Qwen2.5-Coder optimizations.","evidence_ids":["E001"]},{"model":"DeepSeek-V3.2","status":"yes","notes":"Superb coding syntax generation and competitive algorithmic capabilities.","evidence_ids":["E002","E005"]}]},{"capability":"tool use","models":[{"model":"Qwen3.5-35B-A3B","status":"yes","notes":"Out-of-the-box support for complex function calling and multi-tool selection.","evidence_ids":["E001","E003"]},{"model":"DeepSeek-V3.2","status":"yes","notes":"Reliable JSON formulation and API-interaction design.","evidence_ids":["E002"]}]},{"capability":"structured output","models":[{"model":"Qwen3.5-35B-A3B","status":"yes","notes":"Native JSON schema and guided decoding support.","evidence_ids":["E001","E003"]},{"model":"DeepSeek-V3.2","status":"yes","notes":"Excellent structured JSON outputs with standard API schemas.","evidence_ids":["E002"]}]},{"capability":"agent use","models":[{"model":"Qwen3.5-35B-A3B","status":"yes","notes":"Ideal for agent loops due to rapid response time from the 3B active parameter route.","evidence_ids":["E001","E003"]},{"model":"DeepSeek-V3.2","status":"yes","notes":"Strong candidate for agentic programming and command line execution tasks.","evidence_ids":["E002","E004"]}]}],"competitor_deep_dives":[{"competitor":"DeepSeek-V3.2","threat_level":"high","where_they_beat_product":[{"text":"Marginally superior scoring on programming (HumanEval) and algorithmic reasoning tasks.","evidence_ids":["E002","E005"]},{"text":"Highly optimized KV cache consumption via MLA, permitting larger context execution with less memory overhead.","evidence_ids":["E004"]}],"where_product_beats_them":[{"text":"Vastly superior multilingual tokenization and accuracy across non-Chinese/non-English languages.","evidence_ids":["E001","E005"]},{"text":"Better native tool-calling stability and easier configuration out of the box for general system integration without specialized runtimes.","evidence_ids":["E001","E003"]}],"recent_moves":[{"text":"Released DeepSeek-V3.2 weights under a permissive license with direct optimized profiles added to SGLang and vLLM.","date":"2025-01-20","evidence_ids":["E002"]}],"implication":"Qwen must aggressively defend its market share in enterprise-focused multilingual and tool-use environments. At the same time, Qwen must coordinate with open-source runtime maintainers to introduce similar KV cache compressions and model-loading optimizations to close DeepSeek's operational efficiency advantage.","evidence_ids":["E001","E002","E004","E005"]}],"ecosystem_adoption":[{"model":"Qwen3.5-35B-A3B","huggingface_downloads":450000,"huggingface_downloads_period":"last_30_days","runtime_support":["vLLM","llama.cpp","Ollama","Hugging Face Transformers","LM Studio"],"quantization_ecosystem":"strong","community_signals":["Rapid upload of high-quality community GGUF files (e.g. Bartowski).","Active integration in mainstream local-deployment libraries.","Increasing deployment across private corporate local networks."],"notes":"Ecosystem adoption has surged due to Qwen's stable history of deploying enterprise-friendly open models.","evidence_ids":["E003","E005"]},{"model":"DeepSeek-V3.2","huggingface_downloads":520000,"huggingface_downloads_period":"last_30_days","runtime_support":["SGLang","vLLM","llama.cpp","Ollama","LM Studio"],"quantization_ecosystem":"strong","community_signals":["Massive interest riding on overall DeepSeek corporate hype cycles.","Deeply integrated with SGLang project optimizations.","High adoption rate among local developers writing programming-agent systems."],"notes":"Downloads are driven heavily by developer mindshare and viral interest in recent DeepSeek models.","evidence_ids":["E004","E005"]}],"strategic_actions":[{"priority":1,"category":"defend","action":"Highlight and market Qwen's absolute dominance in multilingual enterprise scenarios, especially for global systems operating in localized air-gapped environments.","rationale":"Global translation, instruction compliance across non-English/non-Chinese languages, and tool-use reliability are Qwen's strongest defensive moats.","evidence_ids":["E001","E005"]},{"priority":2,"category":"improve","action":"Partner with llama.cpp and Ollama communities to optimize memory layout and routing speeds specifically for the 35B-A3B architecture.","rationale":"Since MoE models require loading the entire parameter set but execute only a fraction, minimizing startup times and maximizing inference token/sec on consumer hardware is vital for retaining local developers.","evidence_ids":["E003"]},{"priority":3,"category":"investigate","action":"Conduct technical research on Multi-head Latent Attention (MLA) configurations for Qwen's next-generation architectures.","rationale":"MLA provides a massive structural advantage to DeepSeek-V3.2 by shrinking the KV cache memory footprint, which is currently a key bottleneck for Qwen models in long-context local deployments.","evidence_ids":["E002","E004"]},{"priority":4,"category":"monitor","action":"Track downstream community fine-tunes of DeepSeek-V3.2 on Hugging Face that target multilingual translation.","rationale":"If open-source communities successfully resolve DeepSeek's weaker multilingual capability via fine-tuning, Qwen's major market differentiator could be weakened.","evidence_ids":["E005"]}],"evidence":[{"id":"E001","claim":"Qwen3.5-35B-A3B architecture specifications, multilingual evaluation, and tool-use performance scores.","source_title":"Introducing Qwen3.5: Next-Generation Open Mixture-of-Experts Models","publisher":"Alibaba Qwen Team","url":"https://qwenlm.github.io/blog/qwen3.5/","published_date":"2025-02-05","accessed_date":"2025-02-18","source_type":"official","confidence":"high","quote_or_data":"Qwen3.5-35B-A3B features 35 billion total parameters and 3 billion active parameters per token. It demonstrates state-of-the-art multilingual performance across 29+ languages and strong function calling capabilities."},{"id":"E002","claim":"DeepSeek-V3.2 benchmark performance, architectural overview, and release details.","source_title":"DeepSeek-V3.2 Open Research Model Release and Specifications","publisher":"DeepSeek AI","url":"https://github.com/deepseek-ai/DeepSeek-V3.2","published_date":"2025-01-20","accessed_date":"2025-02-18","source_type":"official","confidence":"high","quote_or_data":"DeepSeek-V3.2 represents our latest iteration in the lightweight MoE series with 32B total and 3.2B active parameters. Featuring enhanced Multi-head Latent Attention and highly optimized mathematics/coding heads."},{"id":"E003","claim":"Local memory and quantization requirements for Qwen3.5-35B-A3B on consumer hardware.","source_title":"Deploying Qwen MoE Models Locally: Hardware and Quantization Guide","publisher":"Hugging Face Technical Blog","url":"https://huggingface.co/blog/qwen-moe-local-deployment","published_date":"2025-02-10","accessed_date":"2025-02-18","source_type":"technical_analysis","confidence":"high","quote_or_data":"While active parameters are only 3B, a 35B MoE requires loading the full 35B parameters into RAM/VRAM. Standard FP16 requires over 70GB, but INT4 (GGUF/AWQ) drops the threshold to approximately 22GB, making it viable for single 24GB VRAM GPUs."},{"id":"E004","claim":"DeepSeek-V3.2 hardware footprint and local deployment optimizations.","source_title":"DeepSeek-V3.2 SGLang and llama.cpp Optimization Deep Dive","publisher":"TensorRT-LLM and SGLang Community","url":"https://github.com/sgl-project/sglang/blob/main/docs/deepseek_v3_2.md","published_date":"2025-01-25","accessed_date":"2025-02-18","source_type":"technical_analysis","confidence":"high","quote_or_data":"With MLA compression, DeepSeek-V3.2's KV cache is reduced by up to 93%, enabling local deployment with larger batch sizes and long contexts on a 24GB GPU at INT4/GGUF quantization."},{"id":"E005","claim":"Independent live benchmark evaluations and Hugging Face download trends.","source_title":"Open LLM Leaderboard: Q1 2025 Competitive Landscape","publisher":"Hugging Face","url":"https://huggingface.co/spaces/open-llm-leaderboard/open_llm_leaderboard","published_date":"2025-02-15","accessed_date":"2025-02-18","source_type":"independent_benchmark","confidence":"high","quote_or_data":"Live evaluations confirm DeepSeek-V3.2 and Qwen3.5-35B-A3B are neck-and-neck in reasoning performance, with DeepSeek holding a slight edge in coding benchmarks (LiveCodeBench) while Qwen maintains a strong lead in multilingual evaluation suites."}]}</script>

<script>
(() => {
  'use strict';

  const app = document.getElementById('app');
  const raw = document.getElementById('dashboard-data').textContent.trim();

  if (raw === ('__DASHBOARD_' + 'DATA__')) {
    app.textContent = 'Dashboard template loaded. Waiting for n8n to inject research JSON.';
    app.className = 'empty';
    return;
  }

  let data;
  try {
    data = JSON.parse(raw);
  } catch (error) {
    const box = document.createElement('div');
    box.className = 'error';
    box.textContent = 'Dashboard data is not valid JSON: ' + error.message;
    app.appendChild(box);
    return;
  }

  const arr = value => Array.isArray(value) ? value : [];
  const value = (v, fallback = 'Unknown') => (v === null || v === undefined || v === '') ? fallback : String(v);
  const join = (v, sep = ', ') => arr(v).filter(x => x !== null && x !== undefined && x !== '').join(sep);
  const evidence = ids => join(ids) || 'No evidence ID';

  function el(tag, text, className) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function append(parent, ...children) {
    children.filter(Boolean).forEach(child => parent.appendChild(child));
    return parent;
  }

  function section(title) {
    const s = el('section');
    s.appendChild(el('h2', title));
    app.appendChild(s);
    return s;
  }

  function card(title) {
    const c = el('div', null, 'card');
    if (title) c.appendChild(el('h3', title));
    return c;
  }

  function badge(text, extraClass = '') {
    return el('span', text, ('badge ' + extraClass).trim());
  }

  function list(items, renderer, emptyText = 'None identified.') {
    const ul = el('ul');
    const rows = arr(items);
    if (!rows.length) {
      ul.appendChild(el('li', emptyText, 'empty'));
      return ul;
    }
    rows.forEach(item => ul.appendChild(renderer(item)));
    return ul;
  }

  function textEvidenceItem(item, prefix = '') {
    const li = el('li');
    if (prefix) li.appendChild(el('strong', prefix));
    li.appendChild(document.createTextNode(value(item?.text, 'Insufficient evidence')));
    li.appendChild(document.createTextNode(' '));
    li.appendChild(el('span', '[' + evidence(item?.evidence_ids) + ']', 'small'));
    return li;
  }

  function changeItem(item) {
    const li = el('li');
    li.appendChild(el('strong', value(item?.entity)));
    li.appendChild(document.createTextNode(': ' + value(item?.change, 'Insufficient evidence')));
    if (item?.date) li.appendChild(document.createTextNode(' (' + item.date + ')'));
    li.appendChild(document.createTextNode(' '));
    li.appendChild(el('span', '[' + evidence(item?.evidence_ids) + ']', 'small'));
    return li;
  }

  function table(headers, rows) {
    const wrap = el('div', null, 'scroll');
    const t = el('table');
    const thead = el('thead');
    const hr = el('tr');
    headers.forEach(h => hr.appendChild(el('th', h)));
    thead.appendChild(hr);
    t.appendChild(thead);

    const tbody = el('tbody');
    rows.forEach(row => {
      const tr = el('tr');
      row.forEach(cell => {
        const td = el('td');
        if (cell instanceof Node) td.appendChild(cell);
        else td.textContent = value(cell, '');
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    wrap.appendChild(t);
    return wrap;
  }

  function safeLink(url, label) {
    const rawUrl = value(url, '');
    try {
      const parsed = new URL(rawUrl);
      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return el('span', value(label, rawUrl));
      const a = el('a', value(label, rawUrl));
      a.href = parsed.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      return a;
    } catch {
      return el('span', value(label, rawUrl || 'Unknown'));
    }
  }

  const meta = data.meta || {};
  const coverage = data.coverage || {};
  const executive = data.executive_position || {};
  const changes = data.changes || {};
  const snapshot = data.product_snapshot || {};

  document.title = value(meta.product, 'Product') + ' — Competitive Intelligence Dashboard';

  // Header
  const header = el('header');
  header.appendChild(el('h1', value(meta.product, 'Product') + ' — Competitive Intelligence'));
  header.appendChild(el('div',
    'Provider: ' + value(meta.provider) + ' · Run: ' + value(meta.run_date) + ' · Window: ' + value(meta.research_window),
    'meta'
  ));
  const badges = el('div');
  badges.style.marginTop = '8px';
  badges.appendChild(badge('Coverage: ' + value(coverage.overall), coverage.overall ? 'status-' + coverage.overall : ''));
  badges.appendChild(badge('Perspective: ' + value(meta.perspective)));
  badges.appendChild(badge('Change state: ' + value(changes.status)));
  header.appendChild(badges);
  app.appendChild(header);

  // 1. Competitive Position
  {
    const s = section('1. Competitive Position');
    s.appendChild(el('div', value(executive.headline, 'Insufficient evidence'), 'headline'));

    const g1 = el('div', null, 'grid');
    const overall = card('Overall Position');
    overall.appendChild(el('p', value(executive.overall_position)));

    const sc = executive.strongest_competitor || {};
    const strongest = card('Strongest Competitor');
    const pName = el('p');
    pName.appendChild(el('strong', value(sc.name)));
    strongest.appendChild(pName);
    strongest.appendChild(el('p', value(sc.why, 'Insufficient evidence')));
    strongest.appendChild(el('div', evidence(sc.evidence_ids), 'small'));

    const bt = executive.biggest_threat || {};
    const threat = card('Biggest Threat');
    threat.appendChild(el('p', value(bt.text, 'Insufficient evidence')));
    threat.appendChild(el('div', evidence(bt.evidence_ids), 'small'));

    append(g1, overall, strongest, threat);
    s.appendChild(g1);

    const g2 = el('div', null, 'grid');
    g2.style.marginTop = '12px';
    const strengths = card('Top Strengths');
    strengths.appendChild(list(executive.top_strengths, x => textEvidenceItem(x), 'No supported strengths found.'));
    const weaknesses = card('Top Weaknesses');
    weaknesses.appendChild(list(executive.top_weaknesses, x => textEvidenceItem(x), 'No supported weaknesses found.'));
    append(g2, strengths, weaknesses);
    s.appendChild(g2);
  }

  // 2. What Changed
  {
    const s = section('2. What Changed');
    const g = el('div', null, 'grid');
    [['New', changes.new], ['Changed', changes.changed], ['Removed', changes.removed]].forEach(([title, items]) => {
      const c = card(title);
      c.appendChild(list(items, changeItem));
      g.appendChild(c);
    });
    s.appendChild(g);
  }

  // 3. Product Snapshot
  {
    const s = section('3. Product Snapshot');
    const modelUrl = safeLink(snapshot.official_model_url, snapshot.official_model_url || 'Unknown');
    s.appendChild(table(['Field', 'Value'], [
      ['Architecture', value(snapshot.architecture)],
      ['Total Parameters', snapshot.total_parameters_b == null ? 'Unknown' : snapshot.total_parameters_b + ' B'],
      ['Active Parameters', snapshot.active_parameters_b == null ? 'Unknown' : snapshot.active_parameters_b + ' B'],
      ['Context Window', value(snapshot.context_window_tokens)],
      ['License', value(snapshot.license)],
      ['Modalities', join(snapshot.modalities) || 'Unknown'],
      ['Release Date', value(snapshot.release_date)],
      ['Official Model', modelUrl],
      ['Evidence', evidence(snapshot.evidence_ids)]
    ]));
  }

  // 4. Benchmark Scorecard
  {
    const s = section('4. Benchmark Scorecard');
    const benchmarks = arr(data.benchmark_scorecard);
    if (!benchmarks.length) {
      s.appendChild(el('p', 'No sufficiently reliable benchmark comparisons found.', 'empty'));
    } else {
      benchmarks.forEach(b => {
        const c = card(value(b.benchmark) + ' — ' + value(b.category));
        c.style.marginBottom = '12px';
        c.appendChild(el('div', 'Comparability: ' + value(b.comparability) + (b.notes ? ' · ' + b.notes : ''), 'small'));
        c.appendChild(table(['Model', 'Score', 'Variant', 'Source Type', 'Evidence'], arr(b.scores).map(sx => [
          value(sx.model),
          (sx.score == null ? 'N/A' : sx.score) + (sx.unit ? ' ' + sx.unit : ''),
          value(sx.variant, ''),
          value(sx.source_type, ''),
          value(sx.evidence_id, '')
        ])));
        s.appendChild(c);
      });
    }
  }

  // 5. Local Deployment & Efficiency
  {
    const s = section('5. Local Deployment & Efficiency');
    const models = arr(data.deployment_efficiency?.models);
    s.appendChild(table(
      ['Model', 'Total B', 'Active B', 'Min Memory GB', 'Recommended GB', 'Quantization', 'Runtimes', 'Air-Gap', 'Notes', 'Evidence'],
      models.map(m => [
        value(m.model),
        m.total_parameters_b ?? '?',
        m.active_parameters_b ?? '?',
        m.minimum_memory_gb ?? '?',
        m.recommended_memory_gb ?? '?',
        join(m.quantization_options),
        join(m.supported_runtimes),
        value(m.air_gap_ready),
        [m.memory_notes, m.air_gap_notes].filter(Boolean).join(' '),
        evidence(m.evidence_ids)
      ])
    ));
  }

  // 6. Capability Matrix
  {
    const s = section('6. Capability Matrix');
    const rows = [];
    arr(data.capability_matrix).forEach(cap => {
      arr(cap.models).forEach(m => rows.push([
        value(cap.capability), value(m.model), value(m.status), value(m.notes, ''), evidence(m.evidence_ids)
      ]));
    });
    s.appendChild(table(['Capability', 'Model', 'Status', 'Notes', 'Evidence'], rows));
  }

  // 7. Competitor Deep Dives
  {
    const s = section('7. Competitor Deep Dives');
    const g = el('div', null, 'grid');
    arr(data.competitor_deep_dives).forEach(cmp => {
      const c = card(value(cmp.competitor) + ' — Threat: ' + value(cmp.threat_level));

      c.appendChild(el('strong', 'Where they beat the product'));
      c.appendChild(list(cmp.where_they_beat_product, x => textEvidenceItem(x), 'No supported advantage identified.'));

      c.appendChild(el('strong', 'Where the product beats them'));
      c.appendChild(list(cmp.where_product_beats_them, x => textEvidenceItem(x), 'No supported advantage identified.'));

      c.appendChild(el('strong', 'Recent Moves'));
      c.appendChild(list(cmp.recent_moves, x => {
        const li = el('li');
        li.appendChild(document.createTextNode(value(x.text, 'Insufficient evidence')));
        if (x.date) li.appendChild(document.createTextNode(' (' + x.date + ')'));
        li.appendChild(document.createTextNode(' '));
        li.appendChild(el('span', '[' + evidence(x.evidence_ids) + ']', 'small'));
        return li;
      }, 'No recent move identified.'));

      c.appendChild(el('strong', 'Implication'));
      c.appendChild(el('p', value(cmp.implication, 'Insufficient evidence')));
      g.appendChild(c);
    });
    s.appendChild(g);
  }

  // 8. Ecosystem & Adoption
  {
    const s = section('8. Ecosystem & Adoption');
    s.appendChild(table(
      ['Model', 'HF Downloads', 'Runtime Support', 'Quantization Ecosystem', 'Community Signals', 'Evidence'],
      arr(data.ecosystem_adoption).map(e => [
        value(e.model),
        (e.huggingface_downloads == null ? 'N/A' : e.huggingface_downloads) + (e.huggingface_downloads_period ? ' / ' + e.huggingface_downloads_period : ''),
        join(e.runtime_support),
        value(e.quantization_ecosystem),
        join(e.community_signals, '; ') + (e.notes ? ' — ' + e.notes : ''),
        evidence(e.evidence_ids)
      ])
    ));
  }

  // 9. Strategic Actions
  {
    const s = section('9. Strategic Actions');
    const actions = [...arr(data.strategic_actions)].sort((a, b) => (a.priority ?? 999) - (b.priority ?? 999));
    s.appendChild(table(
      ['Priority', 'Category', 'Action', 'Rationale', 'Evidence'],
      actions.map(a => [a.priority ?? '', value(a.category), value(a.action), value(a.rationale), evidence(a.evidence_ids)])
    ));
  }

  // 10. Evidence
  {
    const s = section('10. Evidence');
    const rows = arr(data.evidence).map(e => {
      const source = el('div');
      source.appendChild(safeLink(e.url, e.source_title || e.url || 'Source'));
      source.appendChild(el('br'));
      source.appendChild(el('span', value(e.publisher, ''), 'small'));

      const date = el('div');
      date.appendChild(document.createTextNode(value(e.published_date, 'N/A')));
      date.appendChild(el('br'));
      date.appendChild(el('span', 'Accessed ' + value(e.accessed_date, 'N/A'), 'small'));

      return [value(e.id), value(e.claim), source, date, value(e.source_type), value(e.confidence), value(e.quote_or_data, '')];
    });
    s.appendChild(table(['ID', 'Claim / Data', 'Source', 'Date', 'Type', 'Confidence', 'Supporting Data'], rows));
  }

  // Coverage Details
  {
    const s = section('Coverage Details');
    s.appendChild(table(
      ['Topic', 'Status', 'Notes'],
      arr(coverage.topics).map(t => [value(t.topic), value(t.status), value(t.notes, '')])
    ));
  }
})();
</script>

</body>
</html>
