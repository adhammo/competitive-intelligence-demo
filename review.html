<style>
  * { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; margin: 0; padding: 28px; line-height: 1.45; color: #222; }
  header { border-bottom: 2px solid #222; margin-bottom: 22px; padding-bottom: 12px; }
  h1 { margin: 0 0 5px; font-size: 26px; }
  h2 { margin-top: 30px; border-bottom: 1px solid #bbb; padding-bottom: 5px; font-size: 19px; }
  h3 { font-size: 15px; margin: 12px 0 6px; }
  p { margin: 6px 0; }
  .meta { font-size: 12px; color: #666; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
  .card { border: 1px solid #ccc; border-radius: 6px; padding: 12px; }
  .headline { font-size: 18px; font-weight: 700; margin-bottom: 12px; }
  .badge { display: inline-block; border: 1px solid #999; border-radius: 999px; padding: 2px 8px; font-size: 11px; margin-right: 5px; }
  .status-sufficient { border-color: #287a3d; color: #287a3d; }
  .status-thin { border-color: #a33; color: #a33; }
  table { width: 100%; border-collapse: collapse; margin: 10px 0 18px; font-size: 12px; }
  th, td { border: 1px solid #d7d7d7; padding: 7px 8px; text-align: left; vertical-align: top; }
  th { background: #f2f2f2; }
  ul { margin: 6px 0; padding-left: 20px; }
  .small { font-size: 11px; color: #666; }
  .priority { font-weight: 700; }
  .evidence-id { font-family: monospace; font-size: 11px; }
  .empty { color: #999; font-style: italic; }
  .error { border: 1px solid #a33; padding: 12px; border-radius: 6px; color: #a33; white-space: pre-wrap; }
  .scroll { overflow-x: auto; }
  @media print { body { padding: 12mm; } .card { break-inside: avoid; } }
</style>
</head>

<script>
(() => {
  'use strict';

  const app = document.getElementById('app');
  const raw = document.getElementById('dashboard-data').textContent.trim();

  if (raw === ('__DASHBOARD_' + 'DATA__')) {
    app.textContent = 'Dashboard template loaded. Waiting for n8n to inject research JSON.';
    app.className = 'empty';
    return;
  }

  let data;
  try {
    data = JSON.parse(raw);
  } catch (error) {
    const box = document.createElement('div');
    box.className = 'error';
    box.textContent = 'Dashboard data is not valid JSON: ' + error.message;
    app.appendChild(box);
    return;
  }

  const arr = value => Array.isArray(value) ? value : [];
  const value = (v, fallback = 'Unknown') => (v === null || v === undefined || v === '') ? fallback : String(v);
  const join = (v, sep = ', ') => arr(v).filter(x => x !== null && x !== undefined && x !== '').join(sep);
  const evidence = ids => join(ids) || 'No evidence ID';

  function el(tag, text, className) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function append(parent, ...children) {
    children.filter(Boolean).forEach(child => parent.appendChild(child));
    return parent;
  }

  function section(title) {
    const s = el('section');
    s.appendChild(el('h2', title));
    app.appendChild(s);
    return s;
  }

  function card(title) {
    const c = el('div', null, 'card');
    if (title) c.appendChild(el('h3', title));
    return c;
  }

  function badge(text, extraClass = '') {
    return el('span', text, ('badge ' + extraClass).trim());
  }

  function list(items, renderer, emptyText = 'None identified.') {
    const ul = el('ul');
    const rows = arr(items);
    if (!rows.length) {
      ul.appendChild(el('li', emptyText, 'empty'));
      return ul;
    }
    rows.forEach(item => ul.appendChild(renderer(item)));
    return ul;
  }

  function textEvidenceItem(item, prefix = '') {
    const li = el('li');
    if (prefix) li.appendChild(el('strong', prefix));
    li.appendChild(document.createTextNode(value(item?.text, 'Insufficient evidence')));
    li.appendChild(document.createTextNode(' '));
    li.appendChild(el('span', '[' + evidence(item?.evidence_ids) + ']', 'small'));
    return li;
  }

  function changeItem(item) {
    const li = el('li');
    li.appendChild(el('strong', value(item?.entity)));
    li.appendChild(document.createTextNode(': ' + value(item?.change, 'Insufficient evidence')));
    if (item?.date) li.appendChild(document.createTextNode(' (' + item.date + ')'));
    li.appendChild(document.createTextNode(' '));
    li.appendChild(el('span', '[' + evidence(item?.evidence_ids) + ']', 'small'));
    return li;
  }

  function table(headers, rows) {
    const wrap = el('div', null, 'scroll');
    const t = el('table');
    const thead = el('thead');
    const hr = el('tr');
    headers.forEach(h => hr.appendChild(el('th', h)));
    thead.appendChild(hr);
    t.appendChild(thead);

    const tbody = el('tbody');
    rows.forEach(row => {
      const tr = el('tr');
      row.forEach(cell => {
        const td = el('td');
        if (cell instanceof Node) td.appendChild(cell);
        else td.textContent = value(cell, '');
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
    t.appendChild(tbody);
    wrap.appendChild(t);
    return wrap;
  }

  function safeLink(url, label) {
    const rawUrl = value(url, '');
    try {
      const parsed = new URL(rawUrl);
      if (parsed.protocol !== 'http:' && parsed.protocol !== 'https:') return el('span', value(label, rawUrl));
      const a = el('a', value(label, rawUrl));
      a.href = parsed.href;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      return a;
    } catch {
      return el('span', value(label, rawUrl || 'Unknown'));
    }
  }

  const meta = data.meta || {};
  const coverage = data.coverage || {};
  const executive = data.executive_position || {};
  const changes = data.changes || {};
  const snapshot = data.product_snapshot || {};

  document.title = value(meta.product, 'Product') + ' — Competitive Intelligence Dashboard';

  // Header
  const header = el('header');
  header.appendChild(el('h1', value(meta.product, 'Product') + ' — Competitive Intelligence'));
  header.appendChild(el('div',
    'Provider: ' + value(meta.provider) + ' · Run: ' + value(meta.run_date) + ' · Window: ' + value(meta.research_window),
    'meta'
  ));
  const badges = el('div');
  badges.style.marginTop = '8px';
  badges.appendChild(badge('Coverage: ' + value(coverage.overall), coverage.overall ? 'status-' + coverage.overall : ''));
  badges.appendChild(badge('Perspective: ' + value(meta.perspective)));
  badges.appendChild(badge('Change state: ' + value(changes.status)));
  header.appendChild(badges);
  app.appendChild(header);

  // 1. Competitive Position
  {
    const s = section('1. Competitive Position');
    s.appendChild(el('div', value(executive.headline, 'Insufficient evidence'), 'headline'));

    const g1 = el('div', null, 'grid');
    const overall = card('Overall Position');
    overall.appendChild(el('p', value(executive.overall_position)));

    const sc = executive.strongest_competitor || {};
    const strongest = card('Strongest Competitor');
    const pName = el('p');
    pName.appendChild(el('strong', value(sc.name)));
    strongest.appendChild(pName);
    strongest.appendChild(el('p', value(sc.why, 'Insufficient evidence')));
    strongest.appendChild(el('div', evidence(sc.evidence_ids), 'small'));

    const bt = executive.biggest_threat || {};
    const threat = card('Biggest Threat');
    threat.appendChild(el('p', value(bt.text, 'Insufficient evidence')));
    threat.appendChild(el('div', evidence(bt.evidence_ids), 'small'));

    append(g1, overall, strongest, threat);
    s.appendChild(g1);

    const g2 = el('div', null, 'grid');
    g2.style.marginTop = '12px';
    const strengths = card('Top Strengths');
    strengths.appendChild(list(executive.top_strengths, x => textEvidenceItem(x), 'No supported strengths found.'));
    const weaknesses = card('Top Weaknesses');
    weaknesses.appendChild(list(executive.top_weaknesses, x => textEvidenceItem(x), 'No supported weaknesses found.'));
    append(g2, strengths, weaknesses);
    s.appendChild(g2);
  }

  // 2. What Changed
  {
    const s = section('2. What Changed');
    const g = el('div', null, 'grid');
    [['New', changes.new], ['Changed', changes.changed], ['Removed', changes.removed]].forEach(([title, items]) => {
      const c = card(title);
      c.appendChild(list(items, changeItem));
      g.appendChild(c);
    });
    s.appendChild(g);
  }

  // 3. Product Snapshot
  {
    const s = section('3. Product Snapshot');
    const modelUrl = safeLink(snapshot.official_model_url, snapshot.official_model_url || 'Unknown');
    s.appendChild(table(['Field', 'Value'], [
      ['Architecture', value(snapshot.architecture)],
      ['Total Parameters', snapshot.total_parameters_b == null ? 'Unknown' : snapshot.total_parameters_b + ' B'],
      ['Active Parameters', snapshot.active_parameters_b == null ? 'Unknown' : snapshot.active_parameters_b + ' B'],
      ['Context Window', value(snapshot.context_window_tokens)],
      ['License', value(snapshot.license)],
      ['Modalities', join(snapshot.modalities) || 'Unknown'],
      ['Release Date', value(snapshot.release_date)],
      ['Official Model', modelUrl],
      ['Evidence', evidence(snapshot.evidence_ids)]
    ]));
  }

  // 4. Benchmark Scorecard
  {
    const s = section('4. Benchmark Scorecard');
    const benchmarks = arr(data.benchmark_scorecard);
    if (!benchmarks.length) {
      s.appendChild(el('p', 'No sufficiently reliable benchmark comparisons found.', 'empty'));
    } else {
      benchmarks.forEach(b => {
        const c = card(value(b.benchmark) + ' — ' + value(b.category));
        c.style.marginBottom = '12px';
        c.appendChild(el('div', 'Comparability: ' + value(b.comparability) + (b.notes ? ' · ' + b.notes : ''), 'small'));
        c.appendChild(table(['Model', 'Score', 'Variant', 'Source Type', 'Evidence'], arr(b.scores).map(sx => [
          value(sx.model),
          (sx.score == null ? 'N/A' : sx.score) + (sx.unit ? ' ' + sx.unit : ''),
          value(sx.variant, ''),
          value(sx.source_type, ''),
          value(sx.evidence_id, '')
        ])));
        s.appendChild(c);
      });
    }
  }

  // 5. Local Deployment & Efficiency
  {
    const s = section('5. Local Deployment & Efficiency');
    const models = arr(data.deployment_efficiency?.models);
    s.appendChild(table(
      ['Model', 'Total B', 'Active B', 'Min Memory GB', 'Recommended GB', 'Quantization', 'Runtimes', 'Air-Gap', 'Notes', 'Evidence'],
      models.map(m => [
        value(m.model),
        m.total_parameters_b ?? '?',
        m.active_parameters_b ?? '?',
        m.minimum_memory_gb ?? '?',
        m.recommended_memory_gb ?? '?',
        join(m.quantization_options),
        join(m.supported_runtimes),
        value(m.air_gap_ready),
        [m.memory_notes, m.air_gap_notes].filter(Boolean).join(' '),
        evidence(m.evidence_ids)
      ])
    ));
  }

  // 6. Capability Matrix
  {
    const s = section('6. Capability Matrix');
    const rows = [];
    arr(data.capability_matrix).forEach(cap => {
      arr(cap.models).forEach(m => rows.push([
        value(cap.capability), value(m.model), value(m.status), value(m.notes, ''), evidence(m.evidence_ids)
      ]));
    });
    s.appendChild(table(['Capability', 'Model', 'Status', 'Notes', 'Evidence'], rows));
  }

  // 7. Competitor Deep Dives
  {
    const s = section('7. Competitor Deep Dives');
    const g = el('div', null, 'grid');
    arr(data.competitor_deep_dives).forEach(cmp => {
      const c = card(value(cmp.competitor) + ' — Threat: ' + value(cmp.threat_level));

      c.appendChild(el('strong', 'Where they beat the product'));
      c.appendChild(list(cmp.where_they_beat_product, x => textEvidenceItem(x), 'No supported advantage identified.'));

      c.appendChild(el('strong', 'Where the product beats them'));
      c.appendChild(list(cmp.where_product_beats_them, x => textEvidenceItem(x), 'No supported advantage identified.'));

      c.appendChild(el('strong', 'Recent Moves'));
      c.appendChild(list(cmp.recent_moves, x => {
        const li = el('li');
        li.appendChild(document.createTextNode(value(x.text, 'Insufficient evidence')));
        if (x.date) li.appendChild(document.createTextNode(' (' + x.date + ')'));
        li.appendChild(document.createTextNode(' '));
        li.appendChild(el('span', '[' + evidence(x.evidence_ids) + ']', 'small'));
        return li;
      }, 'No recent move identified.'));

      c.appendChild(el('strong', 'Implication'));
      c.appendChild(el('p', value(cmp.implication, 'Insufficient evidence')));
      g.appendChild(c);
    });
    s.appendChild(g);
  }

  // 8. Ecosystem & Adoption
  {
    const s = section('8. Ecosystem & Adoption');
    s.appendChild(table(
      ['Model', 'HF Downloads', 'Runtime Support', 'Quantization Ecosystem', 'Community Signals', 'Evidence'],
      arr(data.ecosystem_adoption).map(e => [
        value(e.model),
        (e.huggingface_downloads == null ? 'N/A' : e.huggingface_downloads) + (e.huggingface_downloads_period ? ' / ' + e.huggingface_downloads_period : ''),
        join(e.runtime_support),
        value(e.quantization_ecosystem),
        join(e.community_signals, '; ') + (e.notes ? ' — ' + e.notes : ''),
        evidence(e.evidence_ids)
      ])
    ));
  }

  // 9. Strategic Actions
  {
    const s = section('9. Strategic Actions');
    const actions = [...arr(data.strategic_actions)].sort((a, b) => (a.priority ?? 999) - (b.priority ?? 999));
    s.appendChild(table(
      ['Priority', 'Category', 'Action', 'Rationale', 'Evidence'],
      actions.map(a => [a.priority ?? '', value(a.category), value(a.action), value(a.rationale), evidence(a.evidence_ids)])
    ));
  }

  // 10. Evidence
  {
    const s = section('10. Evidence');
    const rows = arr(data.evidence).map(e => {
      const source = el('div');
      source.appendChild(safeLink(e.url, e.source_title || e.url || 'Source'));
      source.appendChild(el('br'));
      source.appendChild(el('span', value(e.publisher, ''), 'small'));

      const date = el('div');
      date.appendChild(document.createTextNode(value(e.published_date, 'N/A')));
      date.appendChild(el('br'));
      date.appendChild(el('span', 'Accessed ' + value(e.accessed_date, 'N/A'), 'small'));

      return [value(e.id), value(e.claim), source, date, value(e.source_type), value(e.confidence), value(e.quote_or_data, '')];
    });
    s.appendChild(table(['ID', 'Claim / Data', 'Source', 'Date', 'Type', 'Confidence', 'Supporting Data'], rows));
  }

  // Coverage Details
  {
    const s = section('Coverage Details');
    s.appendChild(table(
      ['Topic', 'Status', 'Notes'],
      arr(coverage.topics).map(t => [value(t.topic), value(t.status), value(t.notes, '')])
    ));
  }
})();
</script>

</body>
</html>
